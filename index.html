<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pyroboots</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="https://avatars.githubusercontent.com/u/118924562?v=4">
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
</head>
<body>
    <div id="cursor-glow" aria-hidden="true"></div>
    <canvas id="grid-canvas"></canvas>
    <div class="fx-overlay" aria-hidden="true"></div>

    <div class="content">
        <header>
            <h1>[&nbsp;&nbsp;&nbsp;pyroboots&nbsp;&nbsp;&nbsp;]</h1>
            <div class="status-container">
                <span id="status-dot"></span>
                <span id="status-text">sleeping</span>
            </div>
        </header>
    </div>

    <div id="lightbox" class="lightbox" hidden>
        <div class="lightbox-backdrop"></div>
        <div class="lightbox-panel">
            <button type="button" class="lightbox-close" aria-label="close viewer">[ x ]</button>
            <img id="lightbox-img" class="lightbox-img" src="" alt="">
            <p id="lightbox-caption" class="lightbox-caption"></p>
        </div>
    </div>

    <script src="src/status.js" defer></script>
    <script src="src/headerAnim.js" defer></script>
    <script src="src/stickyGrid.js" defer></script>
    <script src="src/tabs.js" defer></script> 
    <script type="module" src="src/site.js" defer></script> 
</body>
</html>
